<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LABO Premieres Nations</title>
  <style>
    :root {
      --bg: #0f1218;
      --card: #1a1f29;
      --text: #f3f1eb;
      --accent: #d8aa4f;
      --muted: #a8a8a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid rgba(216, 170, 79, 0.35);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 3.2vw, 2rem);
      color: var(--accent);
    }
    p { margin: 8px 0; line-height: 1.55; }
    .muted { color: var(--muted); }
    .row {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      background: var(--accent);
      color: #151515;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    code {
      background: #11151d;
      border: 1px solid #2e3644;
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>LABO Premieres Nations</h1>
    <p>Environnement d'essai local pour apprendre sans toucher au site principal.</p>
    <p class="muted">Serveur local recommande: <code>http://localhost:8081</code></p>
    <div class="row">
      <button id="test-btn" type="button">Tester une interaction</button>
    </div>
    <p id="msg" class="muted"></p>
  </main>

  <script>
    const btn = document.getElementById("test-btn");
    const msg = document.getElementById("msg");
    btn.addEventListener("click", function () {
      const now = new Date().toLocaleString("fr-CA");
      msg.textContent = "Interaction OK - test local execute le " + now;
    });
  </script>
</body>
</html>
